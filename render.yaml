services:
  # Node.js Express API Gateway
  - type: web
    name: neer-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 3001
      - key: AI_SERVICE_URL
        value: https://neer-python.onrender.com
    autoDeploy: true

  # Python FastAPI AI Backend
  - type: web
    name: neer-python
    runtime: python
    rootDir: NEER-main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_CHAT_MODEL
        value: sarvam-105b
      - key: SARVAM_CHAT_URL
        value: https://api.sarvam.ai/v1/chat/completions
      - key: SARVAM_TRANSLATION_MODEL
        value: mayura:v1
      - key: SARVAM_INPUT_TRANSLATION_MODE
        value: modern-colloquial
      - key: SARVAM_OUTPUT_TRANSLATION_MODE
        value: formal
      - key: OPEN_METEO_GEOCODING_URL
        value: https://geocoding-api.open-meteo.com/v1/search
      - key: OPEN_METEO_MARINE_URL
        value: https://marine-api.open-meteo.com/v1/marine
      - key: OPEN_METEO_FORECAST_URL
        value: https://api.open-meteo.com/v1/forecast
      - key: INCOIS_PFZ_URL
        value: https://www.incois.gov.in/MarineFisheries/TextDataHome?mfid=1&request_locale=en
      - key: MOSDAC_SST_DATASET_ID
        value: 3RIMG_L3B_SST_DLY
      - key: MOSDAC_CHLOROPHYLL_DATASET_ID
        value: E06OCM_L4_AC
      - key: MOSDAC_SEARCH_DAYS
        value: 7
      - key: MOSDAC_BOUNDING_BOX
        value: "74.0,8.0,77.0,13.0"
      - key: MOSDAC_DOWNLOAD_DIR
        value: mosdac_data
    autoDeploy: true
